services:
  api:
    command:
      - uvicorn
      - transit.api.main:app
      - --reload
      - --reload-dir
      - /app/src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
