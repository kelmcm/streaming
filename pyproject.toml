[project]
name = "streaming"
version = "0.1.0"
description = "Learning streaming data pipelines"
readme = "README.md"
authors = [
    { name = "Kelly McManus", email = "kmcmanus1939@comcast.net" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6.0",
    "fastapi[standard]>=0.162.4",
    "gtfs-realtime-bindings==3.0.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "protobuf==7.36.2",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_realtime", "src/config.py"]
