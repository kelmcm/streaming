[project]
name = "transit"
version = "0.1.0"
description = "Streaming GTFS transit data pipeline (Kafka, PostGIS, FastAPI/SSE)"
readme = "README.md"
authors = [
    { name = "Kelly McManus", email = "kmcmanus1939@comcast.net" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6.0",
    "fastapi[standard]>=0.162.4",
    "gtfs-realtime-bindings==3.0.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "partridge>=1.1.2",
    "protobuf==7.36.2",
    "psycopg[binary,pool]>=3.3.9",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[project.scripts]
transit-poller = "transit.realtime.cli:main"
transit-ingest-static = "transit.static_gtfs.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
